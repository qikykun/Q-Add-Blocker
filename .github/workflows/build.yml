name: Build & Release

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Generate Keystore
        run: |
          keytool -genkey -v \
            -keystore ${{ github.workspace }}/release.keystore \
            -alias qaddblocker \
            -keyalg RSA -keysize 2048 -validity 36500 \
            -storepass qaddblocker2024 \
            -keypass qaddblocker2024 \
            -dname "CN=Q Add Blocker, O=qikykun, L=ID, C=ID"

      - name: Build Release APK
        run: |
          gradle assembleRelease \
            -Pandroid.injected.signing.store.file=${{ github.workspace }}/release.keystore \
            -Pandroid.injected.signing.store.password=qaddblocker2024 \
            -Pandroid.injected.signing.key.alias=qaddblocker \
            -Pandroid.injected.signing.key.password=qaddblocker2024

      - name: Rename APK
        run: |
          VERSION="v1.0.${GITHUB_RUN_NUMBER}"
          cp app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/Q-Add-Blocker-${VERSION}.apk
          echo "VERSION=${VERSION}" >> $GITHUB_ENV

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION }}
          name: "Q Add Blocker ${{ env.VERSION }}"
          body: |
            ## Q Add Blocker ${{ env.VERSION }}

            DNS ad blocker untuk Android.
            Blokir iklan di browser, game, dan berbagai aplikasi.

            ### Cara Install
            1. Download file APK di bawah
            2. Buka file APK di HP
            3. Izinkan install dari sumber tidak dikenal jika diminta
            4. Buka app dan tekan tombol ON
          files: app/build/outputs/apk/release/Q-Add-Blocker-*.apk
          generate_release_notes: false
